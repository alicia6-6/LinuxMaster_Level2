<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="리눅스마스터 2급 필기 기출문제 풀이" />
  <title>문제 풀기 · 리눅스마스터 2급</title>
  <link rel="stylesheet" href="css/style.css?v=20260906-2" />
  <script>(function(){try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <a class="brand" href="index.html"><span class="logo">L</span><span>리눅스마스터 2급</span></a>
      <div class="header-actions">
        <nav class="top-nav" aria-label="주요 메뉴">
          <a href="index.html">홈</a>
          <a href="quiz.html?mode=random">랜덤문제</a>
          <a href="quiz.html?mode=frequent">빈출문제</a>
          <a href="quiz.html?mode=round">모의고사</a>
          <a href="summary.html">요약노트</a>
          <a href="quiz.html?mode=wrong">오답노트</a>
        </nav>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="테마 전환">🌙</button>
      </div>
    </header>

    <main>
      <div class="hero quiz-hero">
        <div>
          <span class="eyebrow">PRACTICE</span>
          <h1 id="modeTitle">문제 풀기</h1>
          <p id="modeDesc"></p>
        </div>
        <div id="timerCard" class="timer-card" hidden aria-live="polite">
          <span>남은 시간</span>
          <strong id="timerText">100:00</strong>
        </div>
      </div>

      <div id="roundControls" class="round-controls" hidden>
        <label for="roundSelect">응시할 회차</label>
        <select id="roundSelect" class="round-select"></select>
        <button id="startRoundBtn" class="btn" type="button">시험 시작</button>
        <span class="round-note">80문제 · 100분 · 제출 후 채점</span>
      </div>
      <div id="roundHistory" class="round-history" hidden></div>

      <div id="toolbar" class="quiz-toolbar" hidden>
        <div class="progress-bar" aria-hidden="true"><div id="progressBar"></div></div>
        <div id="progressText" class="toolbar-label"></div>
        <div id="scoreText" class="toolbar-score"></div>
      </div>

      <div id="examNavigator" class="exam-navigator" hidden>
        <div class="exam-navigator-head">
          <span>답안 현황</span>
          <span id="answerCount">0 / 80 답변</span>
        </div>
        <div id="questionMap" class="question-map"></div>
      </div>

      <div id="quizArea"></div>
      <div id="resultArea" hidden></div>
      <div id="emptyArea" hidden></div>
    </main>

    <footer class="site-footer">리눅스마스터 2급 필기 기출문제 학습 · 진행 상황은 이 브라우저에 저장됩니다.</footer>
  </div>
  <script src="js/data.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
